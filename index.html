<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Agentic Explorers - Self-Serve Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: dark hero band, then a trail of waypoints beside one open step. Colors and type follow the Camtasia agent kit guide. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f7f9fa; --code:#edf1f3; --line:#d4dbe0; --control:#7d8a93;
  --fg:#1f262d; --heading:#0a1119; --muted:#53606a;
  --accent:#99e500; --accent-hover:#8bd000; --accent-ink:#1a1a1a; --accent-text:#4c7300; --accent-soft:#f2fadf;
  --amber:#7a5200; --amber-soft:#fff6db; --red:#a3251b; --red-soft:#fdecea; --green:#0a6b36; --green-soft:#e5f5ec;
  --info:#0b5f8a; --info-soft:#e6f4fb;
  --note:#fff4c2; --note-line:#e6cf62; --note-fg:#4a3d00;
  --hero-bg:#0a1119; --hero-fg:#f0f1f5; --hero-muted:#a7b1b7; --hero-line:#363e45;
  --term-bg:#101615; --term-fg:#d6e4df; --term-dim:#7d918b; --term-acc:#99e500;
  --f-display:Montserrat, "Avenir Next", Avenir, "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r:12px; --shadow:0 1px 2px rgba(10,17,25,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1119; --surface:#161b1d; --sunk:#1d2427; --code:#23282f; --line:#363e45; --control:#6b7780;
  --fg:#d8dee3; --heading:#f0f1f5; --muted:#a7b1b7;
  --accent:#99e500; --accent-hover:#b3f23d; --accent-ink:#1a1a1a; --accent-text:#99e500; --accent-soft:#1b2a0a;
  --amber:#ffc82e; --amber-soft:#2a220a; --red:#ff6b5e; --red-soft:#2a1215; --green:#0cbb5b; --green-soft:#0b2216;
  --info:#40c6ff; --info-soft:#0b2230;
  --note:#3a3412; --note-line:#7a6a1d; --note-fg:#f3e6a4; --term-bg:#05090c; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a1119; --surface:#161b1d; --sunk:#1d2427; --code:#23282f; --line:#363e45; --control:#6b7780;
  --fg:#d8dee3; --heading:#f0f1f5; --muted:#a7b1b7;
  --accent:#99e500; --accent-hover:#b3f23d; --accent-ink:#1a1a1a; --accent-text:#99e500; --accent-soft:#1b2a0a;
  --amber:#ffc82e; --amber-soft:#2a220a; --red:#ff6b5e; --red-soft:#2a1215; --green:#0cbb5b; --green-soft:#0b2216;
  --info:#40c6ff; --info-soft:#0b2230;
  --note:#3a3412; --note-line:#7a6a1d; --note-fg:#f3e6a4; --term-bg:#05090c; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--accent-text)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;color:var(--heading);letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.review-toggle{flex:none;display:flex;align-items:center;gap:10px;background:var(--note);color:var(--note-fg);border:1px solid var(--note-line);border-radius:999px;padding:6px 14px 6px 8px;font-size:.85rem;font-weight:500;cursor:pointer}
.review-toggle input{width:16px;height:16px;accent-color:var(--amber)}

/* layout */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}

/* trail */
.trail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:0;list-style:none;margin:0;padding:0}
.trail li{position:relative}
.trail button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:.9rem}
.trail button:hover:not([aria-disabled="true"]){background:var(--sunk)}
.trail button[aria-disabled="true"]{cursor:default;opacity:.55}
.trail button:focus-visible{outline:2px solid var(--accent-text)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.75rem;font-weight:600;font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.trail li:not(:last-child)::after{content:"";position:absolute;left:21px;top:36px;bottom:-8px;width:2px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px);pointer-events:none;height:14px}
.trail .done .dot{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink)}
.trail .current button{color:var(--fg);font-weight:600;background:var(--accent-soft)}
.trail .current .dot{border-color:var(--accent-text);color:var(--accent-text)}
.trail .gate .tag{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:600;display:block}
.trail .held .dot{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
@media (max-width:820px){
  .trail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .trail li::after{display:none}
  .trail button{grid-template-columns:24px;justify-items:center;padding:4px}
  .trail .lbl{display:none}
  .dot{width:24px;height:24px}
}

/* step panel */
.step{display:flex;flex-direction:column;gap:20px;min-width:0}
.step-head{display:flex;flex-direction:column;gap:6px}
.lede{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.q{font-weight:600;font-family:var(--f-display);font-size:1rem}
.hint{color:var(--muted);font-size:.88rem}

/* choices */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.choices.two{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.choice{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent-text)}
.choice input{margin-top:3px;accent-color:var(--accent-text);flex:none;width:16px;height:16px}
.choice:has(input:checked){border-color:var(--accent-text);background:var(--accent-soft)}
.choice .t{font-weight:600;display:block}
.choice .d{font-size:.84rem;color:var(--muted);display:block}
.choice .os-ico{font-family:var(--f-display);font-size:1.4rem;line-height:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;background:var(--surface)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink)}
.chip:has(input:focus-visible){outline:2px solid var(--accent-text);outline-offset:2px}

label.field{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.9rem;min-width:0}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent-text);outline:none}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* outcomes */
.outcome{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;border:1px solid}
.outcome .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.outcome .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.ok .ic{background:var(--green);color:var(--surface)}
.wait{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.wait .ic{background:var(--amber);color:var(--surface)}
.stop{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.stop .ic{background:var(--red);color:var(--surface)}
.info{background:var(--sunk);border-color:var(--line)}
.info .ic{background:var(--accent);color:var(--accent-ink)}
.outcome ul,.outcome ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rule{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;border:2px solid}
.rule .verb{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.01em}
.rule.always{border-color:var(--green);background:var(--green-soft)} .rule.always .verb{color:var(--green)}
.rule.never{border-color:var(--red);background:var(--red-soft)} .rule.never .verb{color:var(--red)}

/* buttons */
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:4px}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink);font-family:var(--f-display)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.btn.small{padding:6px 12px;font-size:.85rem}

/* mock screenshots */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.shot{display:flex;flex-direction:column;gap:8px;min-width:0}
.shot figcaption{font-size:.85rem;color:var(--muted)}
.shot figcaption b{color:var(--fg)}
.mock{border-radius:8px;overflow:hidden;border:1px solid var(--line);font-size:12px;line-height:1.45;box-shadow:0 1px 0 var(--line)}
.mock .bar{display:flex;gap:5px;align-items:center;padding:7px 9px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.mock .bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.mock .bar span{margin-left:8px}
.term{background:var(--term-bg);color:var(--term-fg);font-family:var(--f-mono);padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:150px}
.term .dim{color:var(--term-dim)} .term .acc{color:var(--term-acc)}
.term .box{border:1px solid var(--term-acc);border-radius:4px;padding:6px 8px;display:block;margin:4px 0}
.app{background:var(--surface);display:grid;grid-template-columns:90px 1fr;min-height:150px}
.app .side{background:var(--sunk);padding:8px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px}
.app .side .on{color:var(--fg);font-weight:600;background:var(--surface);border-radius:4px;padding:2px 4px;margin-inline:-4px}
.app .main{padding:10px;display:flex;flex-direction:column;gap:6px}
.app .main .hl{outline:2px dashed var(--amber);outline-offset:2px;border-radius:4px}
.app .pill{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:11px}
.app .pill.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-text)}
.app.full{grid-template-columns:1fr}
.screenshot{display:block;width:100%;max-width:720px;height:auto;border-radius:8px;border:1px solid var(--line)}
/* agent check */
.stepline{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:start}
.stepline + .stepline{padding-top:14px;border-top:1px dashed var(--line)}
.stepline .num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem}
.stepbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.code-pill{background:var(--accent-soft);color:var(--accent-text);padding:2px 8px;border-radius:6px;font-weight:600;letter-spacing:.04em}
.prompt{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:.8rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.hint.attn{background:var(--note);color:var(--note-fg);border:1px solid var(--note-line);border-radius:8px;padding:6px 10px;font-weight:600}
.alt-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:26px 16px;border:2px dashed var(--line);border-radius:var(--r);background:var(--bg);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent-text);background:var(--accent-soft)}
.drop:has(input:focus-visible){outline:2px solid var(--accent-text);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop-t{font-family:var(--f-display);font-weight:600}
.paste{display:flex;flex-direction:column;gap:8px}
.checklist{list-style:none;padding:0 !important;margin:0;display:flex;flex-direction:column;gap:3px !important;font-size:.9rem}
.checklist li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.checklist li span{font-weight:700}
.checklist .y span{color:var(--green)} .checklist .n span{color:var(--red)} .checklist .na{color:var(--muted)}
.appbadge{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.appbadge img{width:48px;height:48px;border-radius:11px;flex:none}
.appbadge div{display:flex;flex-direction:column;min-width:0}
.vsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vsteps li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vsteps .num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem}
.vsteps img{max-width:min(242px,100%);height:auto;border-radius:8px;justify-self:end}
.vsteps li:first-child img{border-radius:13px}
@media (max-width:520px){.vsteps li{grid-template-columns:30px minmax(0,1fr)}.vsteps img{grid-column:2;justify-self:start}}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.compare .screenshot{max-width:100%}
.verdict{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px}
.verdict-ok .verdict{background:var(--green-soft);color:var(--green)}
.verdict-no .verdict{background:var(--red-soft);color:var(--red)}
.verdict-ok .screenshot{border:2px solid var(--green)}
.verdict-no .screenshot{border:2px solid var(--red)}
.shot-flag{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick{align-self:flex-start}

/* video */
.video{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);background:linear-gradient(135deg,var(--term-bg),color-mix(in srgb,var(--accent) 45%,var(--term-bg)));display:grid;place-items:center;color:#fff;text-decoration:none;position:relative;overflow:hidden}
.video .play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.video .play::after{content:"";border-left:20px solid #101615;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.video .vt{position:absolute;left:16px;bottom:14px;font-family:var(--f-display);font-weight:600;font-size:1rem;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.video-embed{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--term-bg)}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.chapters li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.chapters .ts{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dl a.btn{justify-content:space-between;width:100%}
.dl small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}

.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent-text);width:16px;height:16px;flex:none}

/* summary */
.summary{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;font-size:.92rem}
.summary dt{color:var(--muted)} .summary dd{margin:0;white-space:pre-wrap}
@media (max-width:520px){.summary{grid-template-columns:minmax(0,1fr)} .summary dd{margin-bottom:8px}}

/* review notes */
.rnote{display:none;background:var(--note);color:var(--note-fg);border:1px dashed var(--note-line);border-radius:8px;padding:10px 12px;font-size:.84rem;line-height:1.45}
.rnote::before{content:"Team note";display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:3px;opacity:.8}
body.review .rnote{display:block}
.ph{background:var(--note);color:var(--note-fg);padding:0 4px;border-radius:3px;font-size:.92em}

/* hero band */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-bottom:1px solid var(--hero-line)}
.hero-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.hero-text{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:44rem}
.hero .meta{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;color:var(--hero-muted)}
.hero .meta b{font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 10px}
.hero h1{color:var(--hero-fg)}
.hero p{color:var(--hero-muted);font-size:1.05rem}
.wrap{padding-block:28px 64px}

/* OS-specific content: step 2's choice decides what shows */
body.os-mac .os-win, body.os-win .os-mac{display:none !important}
.os-only-win,.os-only-mac{display:none}
body.os-win .os-only-win, body.os-mac .os-only-mac{display:inline}

/* content brought over from the kit guide */
.kit{line-height:1.6}
.kit h3{margin:20px 0 4px}
.kit h3.first{margin-top:0}
.kit h4{font-family:var(--f-display);font-size:.95rem;margin:18px 0 6px}
.kit p,.kit ul,.kit ol{margin:0}
.kit ol,.kit ul{padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.kit code{background:var(--code);border-radius:6px;padding:.1em .35em;font-size:.85em}
.kit pre{position:relative;margin:0;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 84px 12px 14px;font-family:var(--f-mono);font-size:.8rem;line-height:1.55;overflow-x:auto}
.kit pre code{background:none;padding:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:inherit}
.kit .copy{position:absolute;top:8px;right:8px;font:600 .8rem/1 var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--control);border-radius:8px;padding:6px 10px;cursor:pointer}
.kit .copy:hover{border-color:var(--accent-text);color:var(--accent-text)}
.kit .message{display:flex;flex-direction:column;gap:8px}
.kit .message .hint{margin:0;color:var(--muted);font-size:.9rem}
.kit .message pre{max-height:9.5em;overflow:auto;padding-right:14px;font-size:.76rem}
.copy-big{align-self:flex-start;padding:12px 26px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent-text);font:700 1rem/1.25 var(--f-display);cursor:pointer}
.copy-big:hover{background:var(--accent-hover)}
.copy-big[data-done]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.callout{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--info-soft);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.callout-title{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--info);margin:0}
.callout.tip{border-left-color:var(--green);background:var(--green-soft)} .callout.tip .callout-title{color:var(--green)}
.callout.warning{border-left-color:var(--amber);background:var(--amber-soft)} .callout.warning .callout-title{color:var(--amber)}
.callout.caution{border-left-color:var(--red);background:var(--red-soft)} .callout.caution .callout-title{color:var(--red)}
.kit details{display:block}
.kit details>summary{cursor:pointer;font-weight:600;padding:4px 0}
.kit details[open]>summary{margin-bottom:6px}
.kit details>ol,.kit details>ul,.kit details>p{margin-bottom:6px}
.kit .help-body{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.kit .help-body details{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--surface)}
.help>summary,.doc>summary{font-family:var(--f-display);font-weight:700;font-size:1rem;list-style-position:outside}
.kit-ref{border-bottom:1px dotted var(--muted);cursor:help}
.kit .table{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.kit table{border-collapse:collapse;width:100%;font-size:.9rem}
.kit th,.kit td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.kit tr:last-child>td{border-bottom:0}
.kit th{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--sunk)}
.kit .doc-body{display:flex;flex-direction:column;gap:12px}
.kit .doc>summary code{font-size:.8rem;font-weight:400}
.diagram{margin:0;display:flex;flex-direction:column;gap:8px}
.diagram svg{display:block;width:100%;height:auto;max-width:100%}
.diagram figcaption{font-size:.88rem;color:var(--muted)}
.d-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.d-hub{fill:var(--accent-soft);stroke:var(--accent-text);stroke-width:1.5}
.d-title{fill:var(--heading);font:700 17px var(--f-display)}
.d-sub{fill:var(--muted);font:14px var(--f-body)}
.d-wire{stroke:var(--accent-text);stroke-width:2;fill:none}
.d-head{fill:var(--accent-text)}
.d-tag{fill:var(--accent-text);font:600 14px var(--f-mono)}
@media (max-width:640px){.diagram svg{display:none}}
.files{margin:0}
.watch{display:inline-flex;align-items:center;gap:10px;font-weight:600}
.play-s{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.play-s::after{content:"";border-left:9px solid var(--accent-ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.part{padding-top:8px;display:flex;flex-direction:column;gap:4px}

@media (prefers-reduced-motion:no-preference){ .step{animation:rise .25s ease-out} @keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="hero-text">
      <p class="meta">Camtasia Agentic Explorers <b>Technical preview</b></p>
      <h1>Make Camtasia videos with Claude or ChatGPT</h1>
      <p>Everything you need to get set up, one step at a time.</p>
    </div>
    <label class="review-toggle" for="reviewMode"><input type="checkbox" id="reviewMode" checked> Show team notes</label>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <ol class="trail" id="trail" aria-label="Setup steps"></ol>
    <main id="stage" aria-live="polite"></main>
  </div>
</div>

<!-- ========== STEP TEMPLATES ========== -->
<template id="s-welcome">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Welcome, Explorer</span>
      <h2>You're in. Let's get your setup ready.</h2>
      <p class="lede">Thanks for applying to the technical preview. This page walks you through everything we used to cover on a call: your goals, two quick tech checks, the preview agreement, and installing the pre-release apps. Most people finish in 20–30 minutes.</p>
    </div>
    <div class="card">
      <h3>Before you start, have these handy</h3>
      <div class="checks">
        <div class="check"><span>•</span><span>The computer you'll make videos on: a Mac, or a Windows 10 or 11 PC, with about 2 GB of free hard drive storage space and permission to install apps</span></div>
        <div class="check"><span>•</span><span>Your AI agent app, if you already use one (Claude Code, ChatGPT Codex, and similar). Not sure? We'll help you check.</span></div>
        <div class="check"><span>•</span><span>Audiate (also known as Camtasia Audiate), signed in to your TechSmith account</span></div>
        <div class="check"><span>•</span><span>A rough idea of the first video you'd like to make</span></div>
      </div>
      <p class="hint">On a work computer, your agent may stop during setup and say to contact IT. It writes the message for you to send. Your answers are saved in this browser, so you can stop and come back later.</p>
    </div>
    <div class="rnote">Assumes the person already submitted the Qualtrics application and was invited here by email. This page replaces the 20-minute validation call (step 2) and the pre-call install email (step 6) from the current intake doc. Decide whether we still offer an optional call for people who get stuck.</div>
    <div class="nav"><span></span><button class="btn primary" data-next>Start setup</button></div>
  </section>
</template>

<template id="s-goals">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Step 1 · Your goals</span>
      <h2>What would success look like for you?</h2>
      <p class="lede">There are no wrong answers here. Picking one number to track helps us, and you, tell whether agentic creation is actually saving time.</p>
    </div>

    <div class="card">
      <p class="q">Which measure matters most to your team?</p>
      <div class="choices two" id="metricChoices">
        <label class="choice"><input type="radio" name="metric" id="m-hpm" value="hpm"><span><span class="t">Production hours per finished minute</span><span class="d">The most common one. Example: 6 hours of work for a 1-minute video.</span></span></label>
        <label class="choice"><input type="radio" name="metric" id="m-vpm" value="vpm"><span><span class="t">Videos published per month</span><span class="d">More output with the same team.</span></span></label>
        <label class="choice"><input type="radio" name="metric" id="m-tat" value="tat"><span><span class="t">Turnaround time</span><span class="d">Days from request to published video.</span></span></label>
        <label class="choice"><input type="radio" name="metric" id="m-upd" value="upd"><span><span class="t">Time to update an existing video</span><span class="d">When the product or script changes.</span></span></label>
        <label class="choice"><input type="radio" name="metric" id="m-oth" value="other"><span><span class="t">Something else</span><span class="d">Describe it in your own words.</span></span></label>
      </div>
      <div id="metricDetail" hidden>
        <div class="row">
          <label class="field" id="otherWrap" hidden>What will you measure?<input type="text" id="metricOther" placeholder="e.g. Localized versions per launch"></label>
          <label class="field"><span id="baseLbl">Today it takes about</span><input type="text" id="baseline" placeholder=""></label>
          <label class="field"><span id="tgtLbl">Success would be</span><input type="text" id="target" placeholder=""></label>
        </div>
        <p class="hint">A rough guess is fine. You can refine it later.</p>
      </div>
    </div>

    <div class="card">
      <p class="q">Which videos do you most urgently need to make first?</p>
      <div class="chips" id="vtypes">
        <label class="chip"><input type="checkbox" value="Product demo" id="vt1">Product demo</label>
        <label class="chip"><input type="checkbox" value="How-to / tutorial" id="vt2">How-to / tutorial</label>
        <label class="chip"><input type="checkbox" value="Training / onboarding" id="vt3">Training / onboarding</label>
        <label class="chip"><input type="checkbox" value="Feature or release update" id="vt4">Feature or release update</label>
        <label class="chip"><input type="checkbox" value="Marketing explainer" id="vt5">Marketing explainer</label>
        <label class="chip"><input type="checkbox" value="Internal comms" id="vt6">Internal comms</label>
      </div>
      <label class="field">Describe your first 1–3 videos
        <textarea id="firstVideos" placeholder="e.g. A 2-minute walkthrough of our new billing settings for customers, from our existing help article. Needed before the March release."></textarea>
      </label>
      <label class="field" style="max-width:280px">When do you need the first one?
        <select id="deadline">
          <option value="">Choose one</option>
          <option>This week</option><option>Within 2 weeks</option><option>Within a month</option><option>Within a quarter</option><option>No fixed date</option>
        </select>
      </label>
    </div>
    <div class="rnote">Not a hard screen. We only require a measure and a short description so onboarding can start them on the right first project. Answers could be posted to the Expedition Tracker if we add a form backend later.</div>
    <div class="nav"><button class="btn link" data-back>Back</button><button class="btn primary" data-next id="goalsNext" disabled>Continue</button></div>
  </section>
</template>

<template id="s-os">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Step 2 · Your computer</span>
      <h2>Which computer will you make videos on?</h2>
      <p class="lede">The pre-release apps and install steps differ a little between Windows and Mac.</p>
    </div>
    <div class="card">
      <div class="choices two">
        <label class="choice"><input type="radio" name="os" id="os-win" value="win"><span><span class="t">Windows</span><span class="d">Windows 10 or 11</span></span></label>
        <label class="choice"><input type="radio" name="os" id="os-mac" value="mac"><span><span class="t">Mac</span><span class="d">macOS</span></span></label>
      </div>
      <div class="outcome info"><span class="ic">i</span><div class="body"><p><b>Make sure you have about 2 GB of free hard drive storage space.</b> This is disk space, not memory (RAM). The pre-release apps and the Camtasia tools need room to install.<span class="os-win"> To check, open File Explorer and click <b>This PC</b>.</span><span class="os-mac"> To check, choose <b>Apple menu &gt; System Settings &gt; General &gt; Storage</b>.</span></p></div></div>
      <div class="rnote">Add minimum OS versions and Apple silicon / Intel support once confirmed for the pre-release builds.</div>
    </div>
    <div class="nav"><button class="btn link" data-back>Back</button><button class="btn primary" data-next id="osNext" disabled>Continue</button></div>
  </section>
</template>

<template id="s-agent">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Step 3 · Tech check 1 of 2</span>
      <h2>Check that your AI app can work on your computer</h2>
      <p class="lede">Camtasia's agentic features need an AI agent app that runs on your computer, such as Claude Code or ChatGPT Codex. Chat in a web browser can't do this. This 2-minute check shows for certain which kind you have. No terminal needed.</p>
    </div>

    <div class="card">
      <div class="stepline"><span class="num">1</span><div class="stepbody">
        <h3>Copy this prompt</h3>
        <p class="hint">It includes your happy phrase, <span class="code-pill" id="agentCode"></span>, so we know the note came from you.</p>
        <pre class="prompt" id="agentPrompt" tabindex="0"></pre>
        <div class="alt-row"><button class="btn primary small" id="copyPrompt">Copy prompt</button><span class="hint" id="copyPromptMsg"></span></div>
      </div></div>
      <div class="stepline"><span class="num">2</span><div class="stepbody">
        <h3>Paste it into your AI app and hit Enter</h3>
        <p class="hint">Use the app you'll make videos with. If it asks permission to run a command or save a file, click <b>Allow</b>. That's a good sign.</p>
        <div class="alt-row"><button class="btn link small" id="whichApp">Not sure which app to use?</button></div>
      </div></div>
      <div class="stepline"><span class="num">3</span><div class="stepbody">
        <h3>Drop the note it saves here</h3>
        <p class="hint">Back here in this guide: your AI saves a little note called <code>hello-camtasia.txt</code> in your Downloads folder (or on your Desktop). Drag it into the box below. The file stays on your computer: this page reads it in your browser and doesn't upload it.</p>
        <label class="drop" id="drop" for="agentFile"><input type="file" id="agentFile" accept=".txt,text/plain"><span class="drop-t">Drag hello-camtasia.txt here</span><span class="hint">or click to choose the file</span></label>
        <div class="alt-row"><button class="btn small" id="noAccess">My AI replied "CHAT ONLY"</button></div>
      </div></div>
    </div>

    <div id="agentResult"></div>

    <div class="rnote">Replaces the self-reported app picker as the gate. To pass, the dropped note needs the person's happy phrase (two words from friendly word lists, 256 combinations) and a Mac or Windows OS that matches this browser. Cloud code tools (ChatGPT, Claude.ai) run on Linux and fail with their own message. The time line is shown but doesn't block. Since the fingerprint was removed, the main proof is that a real file appeared on the computer, so the "paste its contents" fallback was removed too: a chat-only AI could type a convincing note. Older notes with extra lines are still accepted. Before shipping, test with Claude Code, Codex, Cursor, Claude desktop chat, ChatGPT web, and Claude.ai.</div>

    <div class="card kit" id="getAgent" hidden>
      <h3 class="first">Install Claude or ChatGPT</h3>
      <p>This is the app your agent runs in. Your agent installs the Camtasia tools for you, then builds your videos. You need a paid Claude or ChatGPT account.</p>
      <p class="os-win"><strong>Windows.</strong> Install <strong><a href="https://apps.microsoft.com/search?query=Claude" target="_blank" rel="noopener">Claude</a></strong> or <strong><a href="https://apps.microsoft.com/search?query=ChatGPT" target="_blank" rel="noopener">ChatGPT</a></strong> from the Microsoft Store. The installers on the vendors' own sites are small bootstrappers that fail on managed Windows.</p>
      <p class="os-mac"><strong>Mac.</strong> Download <strong><a href="https://claude.com/download" target="_blank" rel="noopener">Claude</a></strong> or <strong><a href="https://chatgpt.com/download/" target="_blank" rel="noopener">ChatGPT</a></strong> and install it.</p>
      <p>Then:</p>
      <ol>
        <li>Open the app and sign in with a paid Claude or ChatGPT account.</li>
        <li>In Claude, click the <strong>Code</strong> tab. In ChatGPT, choose <strong>Codex</strong> from the caret menu.</li>
        <li>Paste the check prompt from above there, and hit Enter.</li>
      </ol>
      <details>
        <summary>If this didn't work</summary>
        <ul>
          <li class="os-win"><strong>The installer stopped or did nothing:</strong> install the app from the Microsoft Store link above instead.</li>
          <li><strong>There's no Code tab or Codex:</strong> update the app. On a work computer, your IT team may have turned it off; ask them to turn it on.</li>
        </ul>
      </details>
      <div class="alt-row"><button class="btn primary small" id="rerunCheck">I installed it. Run the check again</button><button class="btn link small" id="getAgentHold">I need time to get one</button></div>
    </div>

    <div class="card" id="appHelp" hidden>
      <div class="step-head">
        <h3>Which AI apps can do this?</h3>
        <p class="hint">Choose every app you have access to. We'll tell you which one to paste the prompt into.</p>
      </div>
      <div class="choices two" id="harnessChoices"></div>
      <div id="harnessResult"></div>
      <div id="shotGallery" hidden>
        <p class="hint">If one of these looks familiar, choose it. Look at your dock, taskbar, or Start menu, or ask your IT team which AI tools are installed.</p>
        <div class="shots" id="shots"></div>
        <div class="rnote">These are drawn illustrations. Replace each with a real, current screenshot before this goes to participants.</div>
      </div>
    </div>

    <div class="nav"><button class="btn link" data-back>Back</button><button class="btn primary" data-next id="agentNext" disabled>Continue</button></div>
  </section>
</template>

<template id="s-audiate">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Step 4 · Tech check 2 of 2</span>
      <h2>Can Audiate generate AI voices for you?</h2>
      <p class="lede">The agent uses Audiate to create voiceovers. That requires a paid Audiate plan with premium features unlocked, including AI voice generation. A free trial isn't enough.</p>

<template id="s-install">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Step 6 · Pre-release apps</span>
      <h2>Install Camtasia Editor and Audiate Beta</h2>
      <p class="lede">Your agent drives these two pre-release apps. Installing both takes about 10 minutes.</p>
    </div>

    <div class="card kit">
      <h3 class="first">Get the installers</h3>
      <p>Everything you need is in one shared OneDrive folder. Download these two files<span class="os-only-win"> for Windows</span><span class="os-only-mac"> for Mac</span>:</p>
      <ul class="files">
        <li class="os-win"><b>Camtasia Editor</b> development build, Windows installer</li>
        <li class="os-win"><b>Audiate Beta</b>, Windows installer</li>
        <li class="os-mac"><b>Camtasia Editor</b> development build, Mac installer</li>
        <li class="os-mac"><b>Audiate Beta</b>, Mac installer</li>
      </ul>
      <p><a class="btn primary" href="https://offtechsmith-my.sharepoint.com/shared?listurl=https%3a%2f%2fofftechsmith-my.sharepoint.com%2fpersonal%2fc_yager_techsmith_com%2fDocuments&amp;id=%2fpersonal%2fc_yager_techsmith_com%2fDocuments%2fCamtasia+Agentic+Explorers&amp;shareLink=1%2c1&amp;ga=1&amp;share=cgodJ1VuIG-fT7xEb5Du90a4EgUCC3qaSkSjJuPmpNY9-KpqTA" target="_blank" rel="noopener">Open the download folder</a></p>
      <p class="hint">If the folder asks you to sign in or says you don't have access, reply to your invitation email and we'll add you. You'll come back to this folder in step 7 for one more file.</p>
      <div class="rnote">Add the exact installer file names per OS (or direct per-file links) once they're stable. The folder link is the "Camtasia Agentic Explorers" OneDrive share, with Outlook's tracking parameters removed.</div>
    </div>

    <div class="card kit">
      <h3 class="first">1. Install Camtasia Editor</h3>
      <div class="callout caution os-win"><p class="callout-title">On Windows, this replaces your current Camtasia</p>
        <p>The Camtasia Editor in the shared folder is a time-limited development build. On Windows it can't sit beside the release version of Camtasia, so uninstall the release version first. Save any projects you're working on before you do.</p>
        <p><strong>To uninstall:</strong> open <strong>Settings &gt; Apps &gt; Installed apps</strong>, find <strong>Camtasia</strong>, and click <strong>Uninstall</strong>. When it asks, keep your user data.</p>
      </div>
      <div class="callout tip os-mac"><p class="callout-title">On a Mac, this installs beside your current Camtasia</p>
        <p>The Camtasia Editor in the shared folder is a time-limited development build. On a Mac it installs side by side with the release version, so you don't need to remove anything, and you can keep using the release version for other work. Check the app name when you open it so you know which one you're in.</p>
      </div>
      <ol>
        <li>Install the Camtasia Editor development build from the shared folder.</li>
        <li>Open it and sign in.</li>
        <li>Click <strong>New Project</strong> in Camtasia Home.</li>
        <li>Open the advanced settings: <span class="os-win"><strong>Edit &gt; Preferences &gt; Advanced</strong></span><span class="os-mac"><strong>Camtasia &gt; Settings &gt; Advanced</strong></span>.</li>
        <li>Turn on <strong>Allow AI agents to connect to Camtasia</strong> (some builds call it <strong>Agentic Workflows</strong>) and <strong>Always allow script execution</strong>, then click <strong>OK</strong>, quit Camtasia and open it again.<span class="os-mac"> Your agent also turns both on for you in step 7.</span></li>
      </ol>
      <p class="os-mac">You now have two Camtasias. Turn these settings on in the pre-release one you just installed: that's the one your agent drives, and setup names it.</p>
      <div class="callout important"><p class="callout-title">Important</p>
        <p>Keep Camtasia Editor open with a project window whenever your agent works on a video.</p>
      </div>
      <p><strong>You'll know it worked when</strong> both settings are on and a project window is open.</p>
      <details>
        <summary>If this didn't work</summary>
        <ul>
          <li><strong>There's no Allow AI agents setting:</strong> this isn't the build your agent needs. Download the newest one from the shared folder and install it.</li>
          <li class="os-win"><strong>Camtasia won't install beside another Camtasia:</strong> uninstall the other one first, and keep your user data when it asks.</li>
        </ul>
      </details>
    </div>

    <div class="card kit">
      <h3 class="first">2. Install Audiate Beta</h3>
      <p>Audiate Beta narrates your videos. Your agent drives it for you.</p>
      <p class="os-win hint">On Windows, Audiate Beta replaces your current Audiate.</p>
      <p class="os-mac hint">On a Mac, Audiate Beta installs beside your current Audiate.</p>
      <ol>
        <li>Install <strong>Audiate Beta</strong> from the shared folder.</li>
        <li>Open Audiate Beta and sign in.</li>
        <li>Click <strong>Record</strong>, choose <strong>OK</strong> for English, then <strong>OK</strong> to <strong>Download the Forced Aligner</strong>. Wait for the download to finish.</li>
        <li>Quit Audiate, and choose not to save.</li>
        <li>Open Audiate again. If it starts an update, wait for the update to finish: an unfinished update stops your agent from using Audiate.</li>
        <li>Click the profile widget at the top right and check that it says <strong>Pro Subscriber</strong>. Your agent needs it for narration.</li>
        <li>Quit Audiate Beta.</li>
      </ol>
      <div class="callout warning"><p class="callout-title">Leave Audiate Beta closed</p>
        <p>Your agent runs it in the background, and an open window interrupts it.</p>
      </div>
      <p><strong>You'll know it worked when</strong> your profile showed <strong>Pro Subscriber</strong> and Audiate Beta is closed.</p>
      <details>
        <summary>If this didn't work</summary>
        <ul>
          <li><strong>Your profile doesn't say Pro Subscriber:</strong> make sure you signed in with the account that passed the Audiate check in step 4. Your first video can be silent until then.</li>
          <li><strong>An update never finishes:</strong> quit Audiate, open it again and wait.</li>
        </ul>
      </details>
      <div class="rnote">Confirm the Audiate Beta side-by-side behavior on each OS, and whether Windows needs the release Audiate uninstalled first.</div>
    </div>

      <h3 class="first">1. Download the kit</h3>
      <p>The kit is what your agent installs: the Camtasia tools and everything they need, in one zip.</p>
      <ol>
        <li>From the <a href="https://offtechsmith-my.sharepoint.com/shared?listurl=https%3a%2f%2fofftechsmith-my.sharepoint.com%2fpersonal%2fc_yager_techsmith_com%2fDocuments&amp;id=%2fpersonal%2fc_yager_techsmith_com%2fDocuments%2fCamtasia+Agentic+Explorers&amp;shareLink=1%2c1&amp;ga=1&amp;share=cgodJ1VuIG-fT7xEb5Du90a4EgUCC3qaSkSjJuPmpNY9-KpqTA" target="_blank" rel="noopener">shared download folder</a>, download the <strong>kit zip</strong>, and the <code>.sha256</code> file with the same name beside it.</li>
        <li>Leave the zip in your <strong>Downloads</strong> folder, and don't double-click it. If your browser saved it somewhere else, move it to Downloads.</li>

    <div class="card kit">

      <p class="os-mac"><strong>Mac.</strong> In Finder, choose <strong>Go &gt; Home</strong>. Then choose <strong>File &gt; New Folder</strong> and name it <code>camtasia-agent</code>.</p>
      <p class="os-win"><strong>Windows.</strong> In File Explorer, type <code>%USERPROFILE%</code> in the address bar and press <strong>Enter</strong>. Then choose <strong>New &gt; Folder</strong> and name it <code>camtasia-agent</code>.</p>
      <p>Then open it in your app:</p>
      <ul>
        <li><strong>Claude:</strong> in the Code tab, click <strong>Open Folder</strong> just above the prompt box (or <strong>New Project</strong>) and choose <code>camtasia-agent</code>.</li>
        <li><strong>ChatGPT:</strong> in Codex, start a new project and choose <code>camtasia-agent</code> as its folder.</li>
      </ul>
      <p>Keep the folder empty, and make it in your home folder: not on the Desktop, not in Documents, and not in OneDrive, iCloud Drive or Dropbox, which lock files the kit needs to change.</p>
      <p><strong>You'll know it worked when</strong> your app shows <code>camtasia-agent</code> as the open folder.</p>

      <p>Your agent installs the kit, connects it to Camtasia and Audiate, and checks everything. It usually takes a few minutes.</p>
      <ol>
        <li>Quit Camtasia and Audiate Beta.</li>
        <li>Click <strong>Copy setup message</strong> below. (If the button doesn't copy, select all the text in the box under it and copy that.)</li>

        <li><strong>Allow the commands your agent asks to run.</strong> It asks before each one, about 10 to 15 times. Click <strong>Allow</strong> in Claude, or <strong>Approve</strong> in Codex, each time. It works only in your folder and in a temporary folder.</li>
        <li><strong>In Codex, approve running outside the sandbox.</strong> Codex says it will ask to run the Camtasia setup outside its sandbox. Say yes each time: that's how setup reaches Camtasia, Audiate and the internet. It changes no settings.</li>
        <li>Answer what it asks you. Usually that's nothing, or just which app to make videos in if you have both Claude and ChatGPT.<span class="os-mac"> On a Mac it may also ask you to quit Camtasia.</span></li>
      </ol>
      <div class="callout warning"><p class="callout-title">Setup never needs an administrator password</p>
        <p>If anything asks for an administrator password<span class="os-win">, or Windows asks whether to allow an app to make changes to your device</span>, say no and stop. That isn't the kit, and your agent is told never to ask.</p>
      </div>
      <div class="message" data-label="Copy setup message"><button type="button" class="copy-big">Copy setup message</button><p class="hint">Paste it into your agent and press Enter. You don't need to read it.</p>

<pre><code class="language-text">Set up the Camtasia agent kit in the folder this session is open on. This is a first-time setup: if what I pasted also holds an update message, ignore that part. Run every command below yourself, and stop at the first one that fails and tell me what it printed. On Windows run them in PowerShell, not bash. 1. Find the kit zip `v1.1415.0-external.zip` in my Downloads folder (a browser may have added a number to its name): on a Mac run `ls -t ~/Downloads/v1.1415.0-external*.zip | head -n 1`; on Windows run `Get-ChildItem &quot;$env:USERPROFILE\Downloads\v1.1415.0-external*.zip&quot; | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName`. If it lists nothing, stop and tell me to download the kit zip into my Downloads folder and not to open it. Call the path it lists ZIP and use that full path wherever ZIP appears below. 2. Check it (on a Mac run `shasum -a 256 &quot;ZIP&quot;` and use the first word it prints; on Windows run `(Get-FileHash -Algorithm SHA256 -LiteralPath &quot;ZIP&quot;).Hash` and ignore upper and lower case): the result must be `f0d37c27d098d07fb151711e15ab62506cbd902bd02facc400f5bf8d6963b7b7`. If it is not, stop and tell me the download is damaged or is not this kit. 3. Unpack ZIP into a new, empty temporary folder with a command, never by opening it in Finder or with Extract All: on a Mac run `mktemp -d`, then `ditto -x -k &quot;ZIP&quot; &quot;TMP&quot;`; on Windows run `New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid())) | Select-Object -ExpandProperty FullName`, then `Expand-Archive -LiteralPath &quot;ZIP&quot; -DestinationPath &quot;TMP&quot;`. TMP is the folder the first of those two commands printed. 4. If TMP has no `camtasia-workspace/SETUP-AGENT.md`, stop and tell me this kit zip is older than the page I am following and to download the newest one. Otherwise read that file and follow it exactly, from its first step: it says where the kit goes in this folder, what you may and may not do on this computer, and what to tell me.
</code></pre>

<ol>
<li>Copy the message your agent wrote for your IT team. It sits between "message for your IT team" and "end of message".</li>

<p><strong>Windows:</strong></p>
<ol>

<li>Your agent saves a copy first and tells you how to put it back.</li>

<p><strong>You'll know it worked when</strong> each Camtasia tool shows once in a new chat.</p>

<p><a id="help-audiate-unreachable"></a></p>

<summary>Your agent says Audiate may be installed but it cannot reach it</summary>

<ol>
<li>When Codex asks to run the command outside its sandbox, approve it.</li>
<li>If it did not ask, tell it: run that Audiate command outside the sandbox.</li>
</ol>

<li>Quit Audiate Beta.</li>
<li>Tell your agent: Audiate is signed in.</li>
</ol>
<p><strong>You'll know it worked when</strong> your next video has narration.</p>

<p><a id="help-audiate-dialogs"></a></p>
<details>
<summary>Your agent asks to be allowed to answer Audiate's dialogs</summary>
<p>On a Mac, your agent answers Audiate's save dialogs for you, and macOS has to allow that once.</p>
<p><strong>macOS:</strong></p>
<ol>
<li>Open System Settings &gt; Privacy &amp; Security &gt; Automation, find your agent's app, and turn on System Events.</li>
<li>In System Settings &gt; Privacy &amp; Security &gt; Accessibility, turn on your agent's app.</li>
<li>Tell your agent you've done it.</li>
</ol>
<p><strong>You'll know it worked when</strong> your agent makes narration without stopping at a dialog.</p>

        <h3 id="set-up-by-hand">Set up by hand</h3>
<p>When the setup message doesn't work at all, you can unpack the kit and run
setup yourself. This route puts the kit in <code>cmcp/camtasia-workspace</code> in
your home folder, so open that folder in step 8.</p>
<h4 id="extract-the-kit-by-hand">Extract the kit by hand</h4>
<p>The kit must end up at <code>~/cmcp/camtasia-workspace</code> on a Mac, or
<code>%USERPROFILE%\cmcp\camtasia-workspace</code> on Windows. If that folder already
exists, the kit is already installed there: use the <a href="#update">update</a>
instead.</p>
<div class="os-tabs"><div class="os-block os-win"><p><strong>Windows.</strong> In PowerShell, run this, with <code>&lt;zip&gt;</code> replaced by the zip's
path, for example <code>$env:USERPROFILE\Downloads\&lt;kit zip name&gt;</code>:</p>
<pre><code class="language-powershell">Expand-Archive -LiteralPath &lt;zip&gt; -DestinationPath $env:USERPROFILE\cmcp
</code></pre>
<p>File Explorer's <strong>Extract All</strong> also works, but it makes a new folder named
after the zip, next to it, with <code>camtasia-workspace</code> inside, and its dialog
can open off screen. Move that inner <code>camtasia-workspace</code> into <code>cmcp</code> in your
home folder; make <code>cmcp</code> if it isn't there yet.</p>
</div><div class="os-block os-mac"><p><strong>macOS.</strong> In Terminal, run this, with <code>&lt;kit zip name&gt;</code> replaced by the
zip's name:</p>
<pre><code class="language-bash">mkdir -p ~/cmcp &amp;&amp; ditto -x -k ~/Downloads/&lt;kit zip name&gt; ~/cmcp
</code></pre>
<p>Or double-click the zip in Finder and move the <code>camtasia-workspace</code> folder it
makes into <code>cmcp</code> in your home folder.</p></div></div>

<div class="callout warning"><p class="callout-title">Warning</p>
<p>Keep it outside OneDrive or iCloud: long synced paths can make setup fail.
On a managed Windows PC, your Desktop and Documents folders are usually
inside OneDrive, so use <code>%USERPROFILE%\cmcp</code> as above.</p>
</div>
<p><strong>You'll know it worked when</strong> you can open the kit folder and see
<code>setup.ps1</code> and <code>setup.sh</code> in it, not another folder.</p>
<h4 id="run-setup-yourself">Run setup yourself</h4>
<div class="os-tabs"><div class="os-block os-win"><p><strong>Windows.</strong> In PowerShell:</p>
<pre><code class="language-powershell">cd $env:USERPROFILE\cmcp\camtasia-workspace
powershell -ExecutionPolicy Bypass -File .\setup.ps1 --profile=external --voice=auto --scope=folder --yes
</code></pre>
</div><div class="os-block os-mac"><p><strong>macOS.</strong> Quit Camtasia first. Then, in Terminal:</p>
<pre><code class="language-bash">cd ~/cmcp/camtasia-workspace
defaults write com.techsmith.camtasia CMACFSAgenticWorkflows -bool YES
defaults write com.techsmith.camtasia EnableAgenticWorkflows -bool YES
/bin/bash ./setup.sh --profile=external --voice=auto --scope=folder --yes
</code></pre></div></div>

<p>Setup may open Camtasia to check that your agent can drive it, and leaves it
open. Its report ends with a short block of lines for your agent; a line
starting <code>NEEDS-PERSON:</code> is something only you can do. Then open
<code>camtasia-workspace</code> in your app and go on to
<a href="#first-video">step 8</a>.</p>
<details>
<summary>Check the install yourself</summary>
<p>Setup's report (not doctor run on its own) ends its health check with:</p>
<pre><code class="language-output">Health (install lane — this machine's install): green
</code></pre>
<p>and its <strong>Harnesses wired</strong> line names your agent. Doctor alone ends with
<code>N checks — 0 failed, …</code> when healthy. There are two health checks, for
two moments:</p>
<ul>
<li><strong>The install lane</strong>, right after setup. It checks this machine's install
  and does not open Camtasia.</li>
<li><strong>The studio lane</strong>, before your first video. It runs a short script in
  Camtasia, so open Camtasia on a blank project first. You rarely start it
  yourself: when a video needs a recent studio check, the workflow asks for
  it.</li>
</ul>
<p>On macOS, in Terminal:</p>
<pre><code class="language-bash">./kitpy tools/doctor.py --lane install
./kitpy tools/doctor.py --lane studio --probe-lua
</code></pre>
<p>On Windows, in PowerShell:</p>
<pre><code class="language-powershell">.\kitpy.cmd tools/doctor.py --lane install
.\kitpy.cmd tools/doctor.py --lane studio --probe-lua
</code></pre>
<p>Every row says <code>ok</code> or names its own fix. Three rows matter most: <code>MCP slot:</code>
(your agent's Camtasia connection), <code>linked:</code> (the skills your agent sees) and
<code>Lua capability</code> (Camtasia can really be driven). With the Claude desktop app
and no <code>claude</code> command installed, two rows warn <code>Claude CLI unavailable</code>;
that's expected, and the kit's <code>.mcp.json</code> connects Claude instead.</p>
<p>On Windows without the symlink privilege, setup
copies the skills instead of linking them (it says <code>copied</code>, not <code>linked</code>).
Your agent then reads copies, so each kit update (the update reruns setup for
you) and each edit to a skill needs a setup run to refresh them.</p>
</details>
<p>If a setup step fails, <span class="kit-ref" title="A file inside the kit: docs/TROUBLESHOOTING.md">Troubleshooting</span> lists each
symptom with its fix.</p>

        <h3 id="on-a-work-network">On a work network</h3>
<p>If your agent says a download was blocked, send your IT team the lines it
printed that start <code>NETWORK FIX:</code>. Each names one setting to set before you
paste the setup message again:</p>
<ul>
<li><code>SSL_CERT_FILE</code>: the company's certificate file, when the network checks
  secure connections with its own certificate.</li>
<li><code>HTTPS_PROXY</code>: the company's proxy.</li>
<li><code>UV_DEFAULT_INDEX</code> and <code>PIP_INDEX_URL</code>: the company's mirror of Python
  packages.</li>
<li><code>CAMTASIA_UV_MIRROR</code> and <code>UV_PYTHON_INSTALL_MIRROR</code>: the company's mirrors
  of uv and of Python.</li>
</ul>
<p>Setup uses this computer's own certificates and keeps a uv settings file IT
installed for everyone. It never turns certificate checks off.</p>

        <p>Still stuck? Reply to your invitation email, or post in the Agentic Explorers Slack channel once you've joined it.</p>
      </div>
    </details>
