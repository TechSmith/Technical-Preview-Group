    <div class="part"><h3>Reference</h3><p class="hint">Keep this page bookmarked. You'll need these later.</p></div>
    <details class="card kit doc">
      <summary>Update and uninstall the kit</summary>
      <div class="help-body"><h3 id="update">Update</h3>
<p>Ask the person who supplied your kit for the next kit zip and download it into your Downloads folder,
without opening it. Then open your agent on your kit folder (<code>camtasia-agent</code>, or
<code>camtasia-workspace</code> for a kit set up before this page), click <strong>Copy update
message</strong> and paste it. It's the same on a Mac and on Windows:</p>
<div class="message" data-label="Copy update message"><button type="button" class="copy-big">Copy update message</button><p class="hint">Paste it into your agent and press Enter. You don't need to read it.</p>

<pre><code class="language-text">Update the Camtasia agent kit in the folder this session is open on, from a newer kit zip. This updates a kit already in this folder: if what I pasted also holds a setup message, ignore that part. Run every command below yourself, and stop at the first one that fails and tell me what it printed. On Windows run them in PowerShell, not bash. 1. Find the kit zip `v1.1415.0-external.zip` in my Downloads folder (a browser may have added a number to its name): on a Mac run `ls -t ~/Downloads/v1.1415.0-external*.zip | head -n 1`; on Windows run `Get-ChildItem &quot;$env:USERPROFILE\Downloads\v1.1415.0-external*.zip&quot; | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName`. If it lists nothing, stop and tell me to download the kit zip into my Downloads folder and not to open it. Call the path it lists ZIP and use that full path wherever ZIP appears below. 2. Check it (on a Mac run `shasum -a 256 &quot;ZIP&quot;` and use the first word it prints; on Windows run `(Get-FileHash -Algorithm SHA256 -LiteralPath &quot;ZIP&quot;).Hash` and ignore upper and lower case): the result must be `f0d37c27d098d07fb151711e15ab62506cbd902bd02facc400f5bf8d6963b7b7`. If it is not, stop and tell me the download is damaged or is not this kit. 3. This folder must be the kit: it holds `setup.sh` and `KIT.json`. If it does not, stop and tell me to open my kit folder in this app and paste this message there. Never delete, replace, move or extract over this folder: the update changes it in place. 4. In this folder, on a Mac run `./kitpy tools/dev/update.py --from &quot;ZIP&quot; --yes`; on Windows run `.\kitpy.cmd tools/dev/update.py --from &quot;ZIP&quot; --yes`. Let it finish. 5. Follow the Install section of this folder's AGENTS.md, repeat the update's summary and every NEEDS-PERSON line word for word, then tell me to start a new session in this folder.
</code></pre>
</div>

<p>Never copy a newer kit over the installed folder. The update keeps your
settings, runs migrations, reruns setup, and finishes with the install
health check. It may print <em>Migration 002</em> or <em>Audiate detected</em> once; each
names its next step. To run it yourself, in your kit folder:
<code>./kitpy tools/dev/update.py --from &lt;newer-kit.zip&gt;</code>
(<code>.\kitpy.cmd tools/dev/update.py --from &lt;newer-kit.zip&gt;</code> in Windows
PowerShell). To inspect later: <code>./kitpy tools/doctor.py --lane install</code>.</p>
<h3 id="uninstall">Uninstall</h3>
<p>Run these in Terminal (PowerShell on Windows) in your kit folder, or ask
your agent to run them. First see what would be removed; this changes
nothing:</p>
<p>On macOS, in Terminal:</p>
<pre><code class="language-bash">./kitpy tools/dev/uninstall.py
</code></pre>
<p>On Windows, in PowerShell:</p>
<pre><code class="language-powershell">.\kitpy.cmd tools/dev/uninstall.py
</code></pre>
<p>Then remove it:</p>
<p>On macOS, in Terminal:</p>
<pre><code class="language-bash">./kitpy tools/dev/uninstall.py --apply
</code></pre>
<p>On Windows, in PowerShell:</p>
<pre><code class="language-powershell">.\kitpy.cmd tools/dev/uninstall.py --apply
</code></pre>
<p>It removes what setup wrote in the kit folder: the agent connection, the
skill links or copies and the Python setup downloaded into it. Add <code>--venvs</code>
for the Python environments (<code>.venv</code>) and <code>--state</code> for <code>.setup-state.json</code>,
setup's run record. Without those flags it keeps those items and says so. It
never changes your agents' home settings or this computer's shared
preferences file.</p>
<p>It prints where your projects are and leaves them: that folder is your work,
and uninstall never deletes it. Afterwards you can delete
the kit folder; until you do, <code>./setup.sh</code> (<code>.\setup.ps1</code> on Windows)
brings everything back.</p>
<p>A kit set up with <code>--scope=global</code> also has registrations in your agents'
home settings; its uninstall removes them. Add <code>--machine-prefs</code> to remove
the shared preferences file too, unless another camtasia-mcp install on this
computer still uses it. A kit set up with <code>--scope=local</code> keeps its projects
in <code>camtasia-workspace/camtasia-projects</code>: move that folder somewhere you
keep before you delete the kit.</p>
</div>
    </details>
    <details class="card kit doc">
      <summary>Where your work lives</summary>
      <div class="help-body">
<p>What you make, and what the kit learns about how you work, lives in one folder
outside the kit: <code>~/camtasia-system-of-record</code> on a Mac, or
<code>%USERPROFILE%\camtasia-system-of-record</code> on Windows. Updating, uninstalling
or deleting the kit leaves it in place. It holds two things:</p>
<ul>
<li><strong>Your generative projects:</strong> each video project the
  <code>camtasia-video-workflow</code> skill creates, in
  <code>generative-projects/YYYY/MM-Month/video-&lt;slug&gt;/</code>.</li>
<li><strong>Your personal store:</strong> your journal, preferences and lessons, in
  <code>personal/&lt;you&gt;/</code>.</li>
</ul>
<p>Setup's report names the folder it uses on its <strong>Projects:</strong> line. It
differs from the one above when you added <code>--store &lt;folder&gt;</code> to setup, when
another Camtasia install on this computer already set one, or when you set
up with <code>--scope=local</code>, which keeps projects in
<code>camtasia-workspace/camtasia-projects</code>; the <strong>Projects:</strong> line is the one in
use.</p>
<h3 id="your-personal-store">Your personal store</h3>
<p>Your personal store stays on this computer. To move it to another one:</p>
<ol>
<li>On both computers, ask your agent to set your sync folder
   (<code>personal.sync_dir</code>) to a folder you already sync.</li>
<li>
<p>On the computer that has the store, export it:</p>
<p>On macOS, in Terminal:</p>
<p><code>bash
./kitpy tools/loop/store_sync.py export</code></p>
<p>On Windows, in PowerShell:</p>
<p><code>powershell
.\kitpy.cmd tools/loop/store_sync.py export</code></p>
</li>
<li>
<p>When both files it writes (<code>.bundle</code> and <code>.manifest.json</code>) have synced,
   import the bundle on the other computer:</p>
<p>On macOS, in Terminal:</p>
<p><code>bash
./kitpy tools/loop/store_sync.py import &lt;bundle&gt;</code></p>
<p>On Windows, in PowerShell:</p>
<p><code>powershell
.\kitpy.cmd tools/loop/store_sync.py import &lt;bundle&gt;</code></p>
</li>
</ol>
<p>Merge rules and the sync folder: <span class="kit-ref" title="A file inside the kit: docs/STORE-SYNC.md"><code>docs/STORE-SYNC.md</code></span>.</p>
</div>
    </details>
    <details class="card kit doc">
      <summary>Make the Camtasia tools work in every folder</summary>
      <div class="help-body"><h3 id="make-the-camtasia-tools-work-in-every-folder">Make the Camtasia tools work in every folder</h3>
<p>By default, setup connects only the kit folder to your agent and nothing
else (<code>--scope=folder</code>): Claude connects through the folder's own <code>.mcp.json</code> and asks once to
trust the folder, and nothing is written to your agents' settings in your
home folder. Your projects and settings still live outside the kit, so
deleting the kit folder loses no videos. Two other options, each run
as the setup command above with a different <code>--scope</code>:</p>
<ul>
<li><strong>Wire every folder on this computer:</strong> <code>--scope=global</code> registers the kit
  in each agent's home settings and links its skills there. In Codex and
  Cursor, every folder you open then has the Camtasia tools. Claude gets the
  kit's skills in every folder, but its Camtasia tools stay in the kit
  folder, so make videos in a Claude session open there.</li>
<li><strong>Keep everything in the kit folder:</strong> <code>--scope=local</code> keeps your
  settings, the telemetry pointer and your projects inside the kit, with
  projects in <code>camtasia-workspace/camtasia-projects</code>, so that folder must not
  be deleted. Camtasia does not deliver usage data for an install set up
  this way, because its telemetry pointer is not at the usual place.</li>
</ul>
</div>
    </details>
    <details class="card kit doc">
      <summary>The diary study (optional)</summary>
      <div class="help-body">
<p>The kit includes an optional diary study, <code>camtasia-diary-study</code>. It is
opt-in. The question comes at the end of setup; right after install, the agent shows
the full notice in the chat and waits for your answer there. A setup run
with <code>-y</code> or <code>--no-persist</code> leaves the question for the agent; neither
joins you.</p>
<ul>
<li><strong>What it collects:</strong> a journal of how your sessions with the agent go:
  what you were making (one line), what worked, what broke, what you finished
  by hand, which skills and tools were used, and your own words when you
  answer an optional journal question or say <em>"journal: ..."</em>. Not your
  projects, recordings, media, narration or screen content. Keys, emails and
  home paths are removed as it is written.</li>
<li><strong>Where it stays:</strong> on your computer, until you delete it. Nothing is sent
  automatically.</li>
<li><strong>Who and why:</strong> TechSmith collects it, to learn what to build, fix or
  bundle next.</li>
<li><strong>How it is shared:</strong> only when you say <em>"share my journal"</em>. That writes a
  dated bundle; read it first, then ask the person who supplied your kit for a private
  upload link. Never post the bundle in a public or shared channel.</li>
<li><strong>Joining:</strong> answer yes in the chat when the agent asks right after install.
  The agent records your answer with your exact words using <code>journal.py consent
  --answer yes --quote "&lt;your words&gt;"</code>. To join later, run
  <code>./kitpy skills/process/camtasia-diary-study/scripts/journal.py consent</code>, or
  ask the agent to show the full notice and question again.</li>
<li><strong>Leaving:</strong> tell the agent <em>"stop the diary study"</em>, or run
  <code>./kitpy skills/process/camtasia-diary-study/scripts/journal.py revoke</code>, or
  <code>./kitpy tools/loop/roster.py uninstall camtasia-diary-study</code>. Leaving
  deletes the study data you have not shared yet; your journal file and any
  bundles you made stay yours to delete.</li>
</ul>
<p>In Windows PowerShell, type these commands as <code>.\kitpy.cmd</code> instead of
<code>./kitpy</code>.</p></div>
    </details>
    <div class="kit"><details class="card doc" id="doc-glossary"><summary><span>Glossary</span> <code>GLOSSARY.md</code></summary><div class="doc-body">
<p>For people making videos with the kit: the words these pages and your agent
use.</p>
<h2 id="doc-glossary--making-videos">Making videos</h2>
<div class="table"><table>
<thead>
<tr>
<th>Term</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Agent</strong></td>
<td>The AI assistant you work with: Cursor, Claude Code, Codex, or another agent that runs MCP servers and reads Skills.</td>
</tr>
<tr>
<td><strong>Skill</strong></td>
<td>A folder with a <code>SKILL.md</code> that teaches your agent one Camtasia capability, such as building a narrated video or simulating a terminal.</td>
</tr>
<tr>
<td><strong>Bridge</strong></td>
<td>The MCP server that lets your agent drive the Camtasia on your machine. Setup connects it to your agent as <code>camtasia</code>; its folder in the kit is <code>mcps/camtasia-bridge</code>.</td>
</tr>
<tr>
<td><strong>Starting lineup / bench</strong></td>
<td>Skills in the starting lineup are always available to your agent. Bench skills are optional: ask your agent to install one when you need it.</td>
</tr>
<tr>
<td><strong>Doctor</strong></td>
<td><code>./kitpy tools/doctor.py</code>, the health check. <code>--lane studio</code> checks what a video session needs; every line says <code>ok</code> or names the fix.</td>
</tr>
<tr>
<td><strong>The store</strong></td>
<td>The folder outside the kit where your videos, their history and your settings live (<code>projects.root</code>, by default <code>~/camtasia-system-of-record</code>).</td>
</tr>
<tr>
<td><strong>Personal store</strong></td>
<td>Your part of the store: preferences, journal and lessons, under <code>&lt;store&gt;/personal/&lt;login&gt;/</code>.</td>
</tr>
<tr>
<td><strong>Brief / Build / Renders / Export</strong></td>
<td>The folders of one video project in the store: what you provided, the reproducible build, check frames, and the finished files.</td>
</tr>
<tr>
<td><strong>Taste signal</strong></td>
<td>A correction, choice or preference you state while a video is built. Your agent records it, and the next video starts from it.</td>
</tr>
<tr>
<td><strong>Brand kit</strong></td>
<td>A folder (<code>kit.json</code> plus fonts and logos) holding your colours, type and rules, which every video inherits (<span class="kit-ref" title="A file inside the kit: docs/BRANDKIT.md"><code>docs/BRANDKIT.md</code></span>).</td>
</tr>
<tr>
<td><strong>The five-rung cascade</strong></td>
<td>Which brand wins, highest first: this session, this video, your personal kit, your organization's kit, the default. A missing rung is never an error.</td>
</tr>
<tr>
<td><strong>Look</strong></td>
<td>A named art direction: palette, type, layout and motion together.</td>
</tr>
<tr>
<td><strong>Receipts</strong></td>
<td>A video's brand report: each colour traced to its source, each rule followed or deviated from by name.</td>
</tr>
<tr>
<td><strong>Door</strong></td>
<td>The skill a kind of request starts at, such as the brand door (<code>camtasia-brand-kit</code>) or the URL door (<code>camtasia-from-url</code>).</td>
</tr>
<tr>
<td><strong>The loop</strong></td>
<td>How the kit learns: each video records what was built and what you corrected, so the next one starts better. <code>loop.mode</code> is <code>full</code>, <code>record</code> or <code>off</code>.</td>
</tr>
</tbody>
</table></div>
<h2 id="doc-glossary--finished-saved-and-exported">Finished, saved and exported</h2>
<p><strong>Finished (milestone 1)</strong> means the workflow has completed all stations and
presented a completed timeline in Camtasia, generated from a saved <code>build.lua</code>.
The project may still be unsaved. This is the milestone used for production
counts, time and cost. <strong>Saved (milestone 2)</strong> means the Camtasia project has
been saved to disk. <strong>Exported (milestone 3)</strong> means a video has been
successfully exported from the editor. Save the project before closing it.</p></div></details></div>
    <div class="rnote">With a hosted form backend, this summary would be submitted automatically to the Expedition Tracker and trigger the Slack invite.</div>
    <div class="nav"><button class="btn link" data-back>Back</button><button class="btn" id="restart">Start over</button></div>
  </section>
</template>

<!-- Hold screen used when a gate isn't met -->
<template id="s-hold">
  <section class="step">
    <div class="step-head">
      <span class="eyebrow">Paused</span>
      <h2>Your progress is bookmarked</h2>
      <p class="lede" id="holdWhy"></p>
    </div>
    <div class="card">
      <h3>What to do next</h3>
      <div id="holdTodo" class="checks"></div>
      <p class="hint">Your answers are saved in this browser. Bookmark this page, and come back to it in the same browser when you're ready to pick up where you left off.</p>
    </div>
    <div class="rnote">Decide how someone in this state tells us they're blocked (reply-to email, Slack, a form) and whether we follow up.</div>
    <div class="nav"><button class="btn link" id="holdBack">Back to the check</button></div>
  </section>
</template>

<script>
(() => {
  const STEPS = [
    {id:'welcome', label:'Welcome'},
    {id:'goals',   label:'Your goals'},
    {id:'os',      label:'Your computer'},
    {id:'agent',   label:'AI agent check', gate:true},
    {id:'audiate', label:'Audiate check', gate:true},
    {id:'terms',   label:'Preview agreement'},
    {id:'install', label:'Install the apps'},
    {id:'mcp',     label:'Connect Camtasia'},
    {id:'first',   label:'First video'},
    {id:'done',    label:'All set'}
  ];

  // stdio: yes = supports local stdio MCP servers; no = cloud/web only; maybe = depends on setup
  const HARNESS = [
    {id:'claude-code', t:'Claude Code', d:'In a terminal, the Claude desktop app\'s Code tab, or VS Code', stdio:'yes', shot:'claudecode'},
    {id:'codex', t:'ChatGPT Codex', d:'Codex CLI, Codex app, or the Codex IDE extension', stdio:'yes', shot:'codex'},
    {id:'claude-desktop', t:'Claude desktop app (chat)', d:'The installed Claude app, not claude.ai in a browser', stdio:'yes', shot:'claudedesktop'},
    {id:'cursor', t:'Cursor, Windsurf, or VS Code with Copilot Agent mode', d:'AI code editors', stdio:'yes', shot:'editor'},
    {id:'other-cli', t:'Another agent tool', d:'Gemini CLI, Goose, Cline, or similar', stdio:'maybe'},
    {id:'web', t:'ChatGPT or Claude in a web browser', d:'chatgpt.com or claude.ai', stdio:'no', shot:'web'},
    {id:'copilot', t:'Microsoft 365 Copilot or Gemini app', d:'Assistants built into Office or Google', stdio:'no'},
    {id:'unsure', t:'I\'m not sure', d:'Show me what these look like', stdio:'unsure'}
  ];

  const SHOTS = {
    claudecode:{name:'Claude Code', how:'You type <code>claude</code> in Terminal (Mac) or PowerShell (Windows) and a chat prompt opens inside that window. Typing <code>/mcp</code> lists connected tools.',
      html:`<div class="mock"><div class="bar"><i></i><i></i><i></i><span>Terminal</span></div><div class="term"><span class="dim">~/projects $</span> claude
<span class="box"><span class="acc">✻</span> Welcome to Claude Code
<span class="dim">  /help for help · cwd: ~/projects</span></span><span class="acc">&gt;</span> /mcp
<span class="dim">  Manage MCP servers</span></div></div>`},
    codex:{name:'ChatGPT Codex', how:'You type <code>codex</code> in a terminal, or open the Codex app or editor panel, and chat with an agent that can work with files on your computer.',
      html:`<div class="mock"><div class="bar"><i></i><i></i><i></i><span>Terminal</span></div><div class="term"><span class="dim">~/projects $</span> codex
<span class="box"><span class="acc">&gt;_</span> OpenAI Codex
<span class="dim">  model: gpt · directory: ~/projects</span></span><span class="acc">›</span> <span class="dim">Ask Codex to do anything</span></div></div>`},
    claudedesktop:{name:'Claude desktop app', how:'An installed app (not a browser tab). In <b>Settings</b>, you\'ll see <b>Developer</b> or <b>Extensions</b>, where local tools are added.',
      html:`<div class="mock"><div class="bar"><i></i><i></i><i></i><span>Claude · Settings</span></div><div class="app"><div class="side"><span>General</span><span>Account</span><span>Extensions</span><span class="on">Developer</span></div><div class="main"><b>Local MCP servers</b><span style="color:var(--muted)">Add tools that run on this computer.</span><span class="pill acc hl" style="align-self:flex-start">Edit Config</span></div></div></div>`},
    editor:{name:'AI code editor', how:'A code editor with an AI chat panel. Look for an <b>Agent</b> mode and a tools or MCP section in settings.',
      html:`<div class="mock"><div class="bar"><i></i><i></i><i></i><span>Editor</span></div><div class="app" style="grid-template-columns:1fr 120px"><div class="main" style="font-family:var(--f-mono);color:var(--muted)">1  import ...<br>2  <br>3  def main():</div><div class="side" style="background:var(--sunk)"><b style="color:var(--fg)">Chat</b><span class="pill hl">Agent ▾</span><span>Tools (MCP)</span></div></div></div>`},
    web:{name:'Chat in a web browser', how:'If the address bar shows <code>chatgpt.com</code> or <code>claude.ai</code>, this one <b>can\'t</b> run local tools. Check whether you also have one of the installed apps above.',
      html:`<div class="mock"><div class="bar"><i></i><i></i><i></i><span>🔒 chatgpt.com · claude.ai</span></div><div class="app full"><div class="main" style="align-items:center;justify-content:center;min-height:126px;color:var(--muted)">How can I help you today?<span class="pill" style="width:80%">Message…</span></div></div></div>`}
  };

  const KEY = 'aex-setup-v1';
  let S = {step:0, maxStep:0, hold:null};
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const stage = $('#stage');

  // review mode
  const rv = $('#reviewMode');
  const applyReview = () => document.body.classList.toggle('review', rv.checked);
  try { const v = localStorage.getItem(KEY+'-review'); if (v !== null) rv.checked = v === '1'; } catch(e){}
  rv.addEventListener('change', () => { applyReview(); try{localStorage.setItem(KEY+'-review', rv.checked?'1':'0')}catch(e){} renderTrail(); });
  applyReview();

  function renderTrail(){
    const t = $('#trail'); t.innerHTML = '';
    STEPS.forEach((st,i) => {
      const li = document.createElement('li');
      const isCur = i === S.step && !S.hold;
      const held = S.hold && S.hold.step === i;
      li.className = [i < S.maxStep || (i===S.maxStep && i===STEPS.length-1 && S.step===i) ? 'done':'', isCur?'current':'', st.gate?'gate':'', held?'held current':''].join(' ');
      const open = i <= S.maxStep || rv.checked;
      li.innerHTML = `<button type="button" ${open?'':'aria-disabled="true"'} ${isCur?'aria-current="step"':''}><span class="dot">${i < S.maxStep ? '✓' : held ? '!' : i}</span><span class="lbl">${st.gate?'<span class="tag">Required</span>':''}${st.label}</span></button>`;
      li.querySelector('button').addEventListener('click', () => { if (open) go(i); });
      t.appendChild(li);
    });
  }

  function go(i){ S.hold = null; S.step = Math.max(0, Math.min(STEPS.length-1, i)); S.maxStep = Math.max(S.maxStep, S.step); save(); render(); window.scrollTo({top:0, behavior:'smooth'}); }
  function hold(why, todo){ S.hold = {step:S.step, why, todo}; save(); render(); window.scrollTo({top:0, behavior:'smooth'}); }

  function render(){
    const osNow = S.os || BROWSER_OS || 'win';
    document.body.classList.toggle('os-mac', osNow === 'mac');
    document.body.classList.toggle('os-win', osNow !== 'mac');
    renderTrail();
    stage.innerHTML = '';
    if (S.hold){
      stage.appendChild($('#s-hold').content.cloneNode(true));
      $('#holdWhy').textContent = S.hold.why;
      $('#holdTodo').innerHTML = S.hold.todo.map((x,i)=>`<div class="check"><span>${i+1}.</span><span>${x}</span></div>`).join('');
      $('#holdBack').onclick = () => { S.hold = null; save(); render(); };
      return;
    }
    const st = STEPS[S.step];
    stage.appendChild($('#s-'+st.id).content.cloneNode(true));
    const back = $('[data-back]', stage); if (back) back.onclick = () => go(S.step-1);
    const next = $('[data-next]', stage); if (next) next.onclick = () => go(S.step+1);
    (BIND[st.id]||(()=>{}))();
    enhance(stage);
  }

  // ---------- step bindings ----------
  const UNITS = {
    hpm:['Hours of work per finished minute today','e.g. 6 hours','Success would be','e.g. 2 hours'],
    vpm:['Videos published per month today','e.g. 4','Success would be','e.g. 12'],
    tat:['Days from request to published today','e.g. 10 days','Success would be','e.g. 3 days'],
    upd:['Time to update a video today','e.g. 1 day','Success would be','e.g. 1 hour'],
    other:['Where you are today','','Success would be','']
  };
  function persistInputs(ids){ ids.forEach(id => { const el = $('#'+id); if(!el) return; if (S[id] !== undefined) el.value = S[id]; el.addEventListener('input', () => { S[id] = el.value; save(); BIND._goalsCheck && BIND._goalsCheck(); }); }); }

  const BIND = {
    goals(){
      const detail = $('#metricDetail');
      const setMetric = m => {
        detail.hidden = !m; if(!m) return;
        $('#otherWrap').hidden = m !== 'other';
        const u = UNITS[m]; $('#baseLbl').textContent = u[0]; $('#baseline').placeholder = u[1]; $('#tgtLbl').textContent = u[2]; $('#target').placeholder = u[3];
      };
      $$('input[name=metric]').forEach(r => { r.checked = S.metric === r.value; r.addEventListener('change', () => { S.metric = r.value; save(); setMetric(r.value); check(); }); });
      setMetric(S.metric);
      S.vtypes = S.vtypes || [];
      $$('#vtypes input').forEach(c => { c.checked = S.vtypes.includes(c.value); c.addEventListener('change', () => { S.vtypes = $$('#vtypes input:checked').map(x=>x.value); save(); }); });
      persistInputs(['metricOther','baseline','target','firstVideos','deadline']);
      $('#deadline').addEventListener('change', () => { S.deadline = $('#deadline').value; save(); });
      const check = () => { $('#goalsNext').disabled = !(S.metric && (S.firstVideos||'').trim().length > 5); };
      BIND._goalsCheck = check; check();
    },
    os(){
      $$('input[name=os]').forEach(r => { r.checked = S.os === r.value; r.addEventListener('change', () => { S.os = r.value; save(); $('#osNext').disabled = false; }); });
      if (!S.os && BROWSER_OS) { S.os = BROWSER_OS; save(); const r = $('#os-' + BROWSER_OS); if (r) r.checked = true; document.body.classList.toggle('os-mac', S.os === 'mac'); document.body.classList.toggle('os-win', S.os !== 'mac'); }
      $$('input[name=os]').forEach(r => r.addEventListener('change', () => { document.body.classList.toggle('os-mac', S.os === 'mac'); document.body.classList.toggle('os-win', S.os !== 'mac'); }));
      $('#osNext').disabled = !S.os;
    },
    agent(){
      if (!S.agentCode || /^AEX-/.test(S.agentCode)) { S.agentCode = newCode(); save(); }
      const code = S.agentCode;
      $('#agentCode').textContent = code;
      const prompt = agentPrompt(code);
      $('#agentPrompt').textContent = prompt;
      $('#copyPrompt').onclick = async () => {
        try { await navigator.clipboard.writeText(prompt); const m = $('#copyPromptMsg'); m.classList.remove('attn'); m.textContent = 'Copied. Now paste it into your AI app.'; }
        catch(e){ const r = document.createRange(); r.selectNodeContents($('#agentPrompt')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); const m = $('#copyPromptMsg'); m.classList.add('attn'); m.textContent = 'The prompt is highlighted. Press Ctrl+C (Windows) or Cmd+C (Mac) to copy it.'; }
      };
      const help = $('#appHelp');
      $('#whichApp').onclick = () => { help.hidden = false; renderHarness(); help.scrollIntoView({behavior:'smooth', block:'start'}); };
      $('#noAccess').onclick = () => { S.agentCheck = {result:'nolocal'}; save(); showAgentResult(); };
      const drop = $('#drop'), file = $('#agentFile');
      const readFile = f => {
        if (!f) return;
        if (f.size > 20000) { S.agentCheck = {result:'format', note:'That file is too large to be the note.'}; save(); return showAgentResult(); }
        f.text().then(t => verifyAgent(t, f.lastModified, 'file'));
      };
      file.addEventListener('change', () => readFile(file.files[0]));
      ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));
      if ((S.harness||[]).length) { help.hidden = false; renderHarness(); }
      $('#rerunCheck').onclick = () => { S.agentCheck = null; save(); showAgentResult(); $('#agentPrompt').scrollIntoView({behavior:'smooth', block:'center'}); };
      $('#getAgentHold').onclick = () => holdAgent();
      if (S.agentCheck && ['nolocal','cloud'].includes(S.agentCheck.result)) $('#getAgent').hidden = false;
      showAgentResult();
    },
    audiate(){
      $$('input[name=aud1]').forEach(r => { r.checked = S.aud1 === r.value; r.addEventListener('change', () => { S.aud1 = r.value; S.aud2 = null; save(); BIND.audiate(); }); });
      $$('input[name=aud2]').forEach(r => { r.checked = S.aud2 === r.value; r.addEventListener('change', () => { S.aud2 = r.value; save(); evalAudiate(); }); });
      evalAudiate();
    },
    terms(){
      const c = $('#termsDone'); c.checked = !!S.terms;
      c.addEventListener('change', () => { S.terms = c.checked; save(); $('#termsNext').disabled = !c.checked; });
      $('#termsNext').disabled = !S.terms;
    },
    install(){
      const ids = ['ack1','ack2','ack3'];
      ids.forEach(id => { const el = $('#'+id); el.checked = !!S[id]; el.addEventListener('change', upd); });
      function upd(){ ids.forEach(id => S[id] = $('#'+id).checked); save(); $('#installNext').disabled = !ids.every(id => S[id]); }
      upd();
    },
    mcp(){
      const c = $('#mcpDone'); c.checked = !!S.mcp;
      c.addEventListener('change', () => { S.mcp = c.checked; save(); $('#mcpNext').disabled = !c.checked; });
      $('#mcpNext').disabled = !S.mcp;
    },
    first(){
      const c = $('#firstDone'); c.checked = !!S.firstDone;
      c.addEventListener('change', () => { S.firstDone = c.checked; save(); $('#firstNext').disabled = !c.checked; });
      $('#firstNext').disabled = !S.firstDone;
      const g = $('#firstGoal');
      if (S.firstVideos) g.textContent = 'When you\'re ready, ask your agent for the first video you told us about: "' + S.firstVideos.trim().slice(0, 240) + (S.firstVideos.trim().length > 240 ? '…' : '') + '"';
    },
    done(){
      const metricName = {hpm:'Production hours per finished minute', vpm:'Videos published per month', tat:'Turnaround time', upd:'Time to update an existing video', other: S.metricOther || 'Other'}[S.metric] || '—';
      const harnessNames = (S.harness||[]).map(id => (HARNESS.find(h=>h.id===id)||{}).t).filter(Boolean).join(', ') || '—';
      const rows = [
        ['Success measure', metricName],
        ['Today → goal', `${S.baseline||'?'} → ${S.target||'?'}`],
        ['First videos', [(S.vtypes||[]).join(', '), S.firstVideos].filter(Boolean).join('\n') || '—'],
        ['Needed by', S.deadline || '—'],
        ['Computer', S.os === 'mac' ? 'Mac' : S.os === 'win' ? 'Windows' : '—'],
        ['Agent app check', S.agentCheck && S.agentCheck.result === 'pass' ? `Passed on ${OS_NAME[S.agentCheck.os] || 'this computer'}` + (harnessNames !== '—' ? ` (${harnessNames})` : '') : 'Not yet'],
        ['Audiate AI voices', S.aud2 === 'yes' ? 'Confirmed' : '—'],
        ['Agreement', S.terms ? 'Agreed' : 'Not yet'],
        ['Pre-release apps', S.ack1 && S.ack3 ? 'Installed' : 'Not yet'],
        ['Camtasia tools', S.mcp ? 'Set up' : 'Not yet'],
        ['First video', S.firstDone ? 'Started' : 'Not yet']
      ];
      $('#summary').innerHTML = rows.map(([k,v]) => `<dt>${k}</dt><dd></dd>`).join('');
      $$('#summary dd').forEach((dd,i) => dd.textContent = rows[i][1]);
      const text = 'Agentic Explorers setup summary\n' + rows.map(([k,v]) => `${k}: ${v}`).join('\n');
      const ta = $('#sumText'); ta.value = text;
      $('#copySum').onclick = async () => {
        try { await navigator.clipboard.writeText(text); $('#copyMsg').textContent = 'Copied'; }
        catch(e){ ta.hidden = false; ta.focus(); ta.select(); $('#copyMsg').textContent = 'Select the text below and copy it'; }
      };
      $('#restart').onclick = () => { S = {step:0, maxStep:0, hold:null}; save(); render(); };
    }
  };

  function outcome(kind, icon, html){ return `<div class="outcome ${kind}"><span class="ic">${icon}</span><div class="body">${html}</div></div>`; }

  const HAPPY_ADJ = ['sunny','happy','cheerful','bright','cozy','merry','jolly','breezy','sparkly','golden','friendly','lucky','gentle','bouncy','peppy','glowing'];
  const HAPPY_NOUN = ['pancake','rainbow','sunflower','puppy','kitten','cupcake','meadow','balloon','picnic','sunshine','daisy','otter','lemonade','waffle','garden','butterfly'];
  function newCode(){
    const b = new Uint8Array(2);
    try { crypto.getRandomValues(b); } catch(e){ b[0] = Math.random()*256; b[1] = Math.random()*256; }
    return HAPPY_ADJ[b[0] % 16] + ' ' + HAPPY_NOUN[b[1] % 16];
  }

  function agentPrompt(code){
    return `Hi! I'm getting set up to make videos with Camtasia, and I'd love your help with a quick check.

Please use your tools on this computer to make a little note for me. Really do each step with your tools, no pretending.

1. Look up which computer system I'm using, and today's date and time.
2. Save a text file called hello-camtasia.txt in my Downloads folder (or on my Desktop if that's easier) with these lines:
phrase: ${code}
os: <my computer system>
time: <today's date and time>
3. Then tell me "All done!" and where you saved it.

If you can't use tools on my computer, that's totally fine. Just reply: CHAT ONLY

When you're finished, please remind me to go back to my Camtasia setup guide to finish step 3.`;
  }

  const BROWSER_OS = /Windows/.test(navigator.userAgent) ? 'win' : /Macintosh|Mac OS X/.test(navigator.userAgent) ? 'mac' : null;
  const OS_NAME = {mac:'Mac', win:'Windows', linux:'Linux'};

  function parseCheck(text){
    const o = {};
    String(text).split(/\r?\n/).forEach(line => {
      const m = line.replace(/^[\s>*`#-]+/, '').match(/^(phrase|code|fingerprint|sha-?256|os|home|time)\s*[:=]\s*(.+)$/i);
      if (m) o[{phrase:'code', fingerprint:'sha256'}[m[1].toLowerCase()] || m[1].toLowerCase().replace('-','')] = m[2].replace(/[`*]+/g,'').replace(/^["']|["']$/g,'').trim();
    });
    return o;
  }

  function verifyAgent(text, lastModified, method){
    const f = parseCheck(text);
    if (!f.code || !f.os) { S.agentCheck = {result:'format'}; save(); return showAgentResult(); }
    const norm = t => t.toLowerCase().replace(/["'.!]/g, '').replace(/\s+/g, ' ').trim();
    const codeOk = norm(f.code) === norm(S.agentCode);
    const osL = f.os.toLowerCase();
    const repOs = /mac|darwin|os x/.test(osL) ? 'mac' : /windows|win32|win64|\bnt\b/.test(osL) ? 'win' : /linux|ubuntu|debian|alpine|fedora/.test(osL) ? 'linux' : 'other';
    const expected = BROWSER_OS || S.os || null;
    const osOk = expected ? repOs === expected : (repOs === 'mac' || repOs === 'win');
    const cloudHome = f.home ? /^\/(mnt|tmp|workspace|code|app|sandbox|home)\b/i.test(f.home) : false;
    const t = Date.parse(f.time || '');
    const fresh = (lastModified && Date.now() - lastModified < 2*3600e3) || (!isNaN(t) && Math.abs(Date.now() - t) < 2*3600e3);
    let result = 'pass';
    if (repOs === 'linux' || cloudHome) result = expected === 'linux' ? 'mismatch' : 'cloud';
    else if (!codeOk) result = 'oldcode';
    else if (!osOk) result = 'mismatch';
    S.agentCheck = {result, method, os:repOs, expected, codeOk, osOk, fresh, reportedOs:f.os.slice(0,80)};
    save(); showAgentResult();
  }

  function showAgentResult(){
    const res = $('#agentResult'), next = $('#agentNext'), c = S.agentCheck;
    if (!res) return;
    next.disabled = !(c && c.result === 'pass');
    if (!c) { res.innerHTML = ''; return; }
    const row = (ok, label) => `<li class="${ok === null ? 'na' : ok ? 'y' : 'n'}"><span>${ok === null ? '–' : ok ? '✓' : '✕'}</span>${label}</li>`;
    const rows = c.result === 'format' || c.result === 'nolocal' ? '' : `<ul class="checklist">
      ${row(c.codeOk, 'Your happy phrase matches')}
      ${row(c.osOk && c.result !== 'cloud', `Ran on this ${OS_NAME[c.expected] || ''} computer${c.result === 'cloud' ? ', not in the cloud' : ''}`.replace('  ',' '))}
      ${row(c.fresh ? true : null, c.fresh ? 'Created in the last 2 hours' : 'Creation time not confirmed (not required)')}
    </ul>`;
    const again = `<div class="alt-row"><button class="btn small" data-act="install">Show me how to install one</button><button class="btn small" data-act="help">Show me which apps work</button><button class="btn link small" data-act="hold">I need time to get one</button></div>`;
    const M = {
      pass: outcome('ok','✓', `<p><b>Your AI app can work on your computer.</b> It ran commands and saved a note on your computer, which is just what Camtasia's agent tools need.</p>${rows}${S.os && c.os !== S.os ? `<p class="hint">Heads up: earlier you chose ${OS_NAME[S.os]}, but this check ran on ${OS_NAME[c.os]}. <button class="btn link small" data-act="fixos">Switch to ${OS_NAME[c.os]}</button></p>` : ''}`),
      cloud: outcome('stop','!', `<p><b>Your AI ran this in the cloud, not on your computer.</b> ChatGPT and Claude in a web browser can run code on their own servers, but they can't control apps on your computer.</p>${rows}<ul><li>Using the <b>Claude desktop app</b>? Open its <b>Code</b> tab and paste the prompt there.</li><li>Otherwise you'll need an agent app such as Claude Code or ChatGPT Codex.</li></ul>${again}`),
      nolocal: outcome('stop','!', `<p><b>Thanks for checking! That app is chat only.</b> It can't use tools on your computer, so it can't drive Camtasia.</p><ul><li>Using the <b>Claude desktop app</b>? Open its <b>Code</b> tab and paste the prompt there.</li><li>Using ChatGPT or Claude in a web browser? You'll need an agent app such as Claude Code or ChatGPT Codex.</li></ul>${again}`),
      oldcode: outcome('wait','?', `<p><b>This note has a different happy phrase.</b> It may be from an earlier try. Copy the prompt above again, paste it into your AI app, and drop the new note here.</p>${rows}`),
      mismatch: outcome('wait','?', `<p><b>Something in the note doesn't match this computer.</b> Make sure you're running the check on the same computer you'll use for Camtasia, then try again.</p>${rows}<p class="hint">The note says the computer system is "<span class="mono" id="repOs"></span>".</p>`),
      format: outcome('wait','?', `<p><b>That doesn't look like the note.</b> ${c.note || 'It should have lines starting with phrase:, os: and time:.'} Make sure you chose <code>hello-camtasia.txt</code>, or copy the prompt again and ask your AI to redo it.</p>`)
    };
    res.innerHTML = M[c.result] || '';
    const ro = $('#repOs'); if (ro) ro.textContent = c.reportedOs || '';
    $$('[data-act]', res).forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.act;
      if (a === 'help') { $('#appHelp').hidden = false; renderHarness(); $('#appHelp').scrollIntoView({behavior:'smooth', block:'start'}); }
      if (a === 'hold') holdAgent();
      if (a === 'install') showGetAgent();
      if (a === 'fixos') { S.os = c.os; save(); showAgentResult(); }
    }));
  }

  function holdAgent(){
    hold('You need an AI agent app that can work on your computer before you can connect Camtasia.', [
      'Check whether your company already provides Claude Code or ChatGPT Codex. Your IT team will know.',
      'If not, ask whoever approves software purchases about a Claude or ChatGPT plan that includes it.',
      'Install it, open it once, and sign in.',
      'Come back to this page and run the AI app check again.'
    ]);
  }

  function renderHarness(){
    S.harness = S.harness || [];
    const wrap = $('#harnessChoices');
    wrap.innerHTML = HARNESS.map(h => `<label class="choice"><input type="checkbox" value="${h.id}" id="h-${h.id}" ${S.harness.includes(h.id)?'checked':''}><span><span class="t">${h.t}</span><span class="d">${h.d}</span></span></label>`).join('');
    $('#shots').innerHTML = Object.entries(SHOTS).map(([k,s]) => {
      const h = HARNESS.find(x => x.shot === k);
      return `<figure class="shot" style="margin:0">${s.html}<figcaption><span class="shot-flag">Illustration</span> · <b>${s.name}.</b> ${s.how}</figcaption>${h && h.stdio==='yes' ? `<button class="btn small pick" data-pick="${h.id}">I have this one</button>` : ''}</figure>`;
    }).join('');
    $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.pick; if (!S.harness.includes(id)) S.harness.push(id);
      S.harness = S.harness.filter(x => x !== 'unsure'); save(); renderHarness();
    }));
    $$('input', wrap).forEach(c => c.addEventListener('change', () => {
      let v = $$('input:checked', wrap).map(x => x.value);
      v = (c.value === 'unsure' && c.checked) ? ['unsure'] : v.filter(x => x !== 'unsure');
      S.harness = v; save(); renderHarness();
    }));
    const sel = S.harness.map(id => HARNESS.find(h=>h.id===id)).filter(Boolean);
    const out = $('#harnessResult');
    $('#shotGallery').hidden = !sel.some(h => h.stdio==='unsure' || h.stdio==='no');
    out.innerHTML = '';
    if (!sel.length) return;
    const yes = sel.filter(h => h.stdio==='yes'), maybe = sel.filter(h => h.stdio==='maybe');
    const toTop = `<div class="alt-row"><button class="btn small" data-act="top">Back to the check</button></div>`;
    if (yes.length) {
      const first = yes[0], s = SHOTS[first.shot];
      out.innerHTML = outcome('ok','✓', `<p><b>Use ${first.t}.</b> Open it, sign in, and paste the prompt from step 1.${first.id === 'claude-desktop' ? ' In the Claude desktop app, paste it in the <b>Code</b> tab, not a regular chat.' : ''}</p>${s ? `<figure class="shot" style="margin:0;max-width:460px">${s.html}<figcaption><span class="shot-flag">Illustration</span> · ${s.how}</figcaption></figure>` : ''}${toTop}`);
    } else if (maybe.length) {
      out.innerHTML = outcome('wait','?', `<p><b>That may work.</b> Paste the prompt from step 1 into it. If the check passes, you're set.</p>${toTop}`);
    } else if (sel.some(h => h.stdio==='unsure')) {
      out.innerHTML = outcome('info','i', `<p><b>No problem.</b> Compare the pictures below with what's on your computer. If one matches, choose "I have this one".</p>`);
    } else {
      out.innerHTML = outcome('stop','!', `<p><b>Those apps can't work on your computer.</b> Web chat and office assistants only work in the cloud, so they can't control Camtasia.</p>
        <p>Most Explorers use one of these. Each needs a paid plan from its provider:</p>
        <ul><li><b>Claude Code</b>, included with Claude Pro, Max, Team, and Enterprise plans</li><li><b>ChatGPT Codex</b>, included with ChatGPT Plus, Pro, Business, and Enterprise plans</li></ul>
        <div class="alt-row"><button class="btn small" data-act="install">Show me how to install one</button><button class="btn link small" data-act="hold">I need time to get one</button></div>`);
    }
    $$('[data-act]', out).forEach(b => b.addEventListener('click', () => {
      if (b.dataset.act === 'top') $('#agentPrompt').scrollIntoView({behavior:'smooth', block:'center'});
      if (b.dataset.act === 'hold') holdAgent();
      if (b.dataset.act === 'install') showGetAgent();
    }));
  }

  function evalAudiate(){
    const res = $('#audResult'), next = $('#audNext'), card2 = $('#aud2Card');
    next.disabled = true; res.innerHTML = '';
    card2.hidden = S.aud1 !== 'yes';
    if (S.aud1 === 'no'){
      res.innerHTML = outcome('wait','!', `<p><b>You'll need Audiate (Camtasia Audiate) with premium features.</b> AI voice generation is part of the premium features, and the agent depends on it for voiceovers.</p>
        <p class="hint"><span class="ph">Add link: how to get Audiate premium / pricing</span></p>
        <div class="nav" style="justify-content:flex-start;padding:0"><button class="btn small" id="audHold">Bookmark progress</button></div>`);
      $('#audHold').onclick = () => hold('Camtasia Audiate with premium features (AI voice generation) is required for the preview.', [
        'Get Camtasia Audiate with premium features unlocked. <span class="ph">link TBD</span>',
        'Install it and sign in with your TechSmith account.',
        'Come back to this page and redo the Audiate check.'
      ]);
      return;
    }
    if (S.aud1 === 'legacy'){
      res.innerHTML = outcome('wait','?', `<p><b>Let's find out what your license includes.</b> If your company provides Camtasia through an older (legacy) subscription, Audiate may not be included, or it may need security review because it connects to the cloud.</p>
        <ul><li>Ask your Camtasia license admin whether your plan includes <b>Camtasia Audiate with premium features</b>.</li><li>If your security team needs to approve cloud-connected apps, point them to the <a href="https://www.techsmith.com/trust-center/" target="_blank" rel="noopener">TechSmith Trust Center</a>.</li></ul>
        <div class="nav" style="justify-content:flex-start;padding:0"><button class="btn small" id="audHold2">Bookmark progress</button></div>`);
      $('#audHold2').onclick = () => hold('We need to confirm you have Camtasia Audiate with premium features before you continue.', [
        'Ask your Camtasia license admin whether your plan includes Audiate with premium (AI voice) features.',
        'If needed, share the TechSmith Trust Center with your security team.',
        'Once Audiate is installed and you can sign in, come back and redo this check.'
      ]);
      return;
    }
    if (S.aud1 !== 'yes') return;
    if (S.aud2 === 'yes'){ res.innerHTML = outcome('ok','✓', `<p><b>You're all set.</b> Premium AI voices are unlocked in Audiate.</p>`); next.disabled = false; return; }
    if (S.aud2 === 'lock'){
      res.innerHTML = outcome('stop','!', `<p><b>Premium features aren't unlocked on your account yet.</b> The preview needs AI voice generation.</p>
        <ul><li>Make sure you're signed in with the account that holds your Audiate subscription.</li><li>If your license is managed by your company, ask your admin to assign a premium seat.</li><li>Otherwise, use the <b>Upgrade</b> button on that screen to unlock premium features.</li></ul>
        <p><b>A free trial isn't enough.</b> The preview runs longer than a trial, so you'll need a paid plan with premium features.</p>
        <div class="nav" style="justify-content:flex-start;padding:0"><button class="btn small" id="audHold3">Bookmark progress</button></div>`);
      $('#audHold3').onclick = () => hold('AI voice generation in Audiate (a premium feature) is required for the preview.', [
        'Check that you\'re signed in to Audiate with the right TechSmith account.',
        'Upgrade to a paid plan with premium features (a free trial isn\'t enough), or ask your license admin for a premium seat.',
        'Come back and redo the Audiate check.'
      ]);
      return;
    }
    if (S.aud2 === 'cant'){
      res.innerHTML = outcome('wait','?', `<p><b>Let's sort it out.</b> Make sure Audiate is up to date and you're signed in. Click <b>Generate</b>, then the <b>Generate Audio</b> tab. If you still can't find it, post a screenshot in the Explorers Slack channel or reply to your invitation email and we'll help.</p>`);
    }
  }

  function showGetAgent(){ const g = $('#getAgent'); if (!g) return; g.hidden = false; g.scrollIntoView({behavior:'smooth', block:'start'}); }

  // Copy buttons for content brought over from the kit guide.
  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((ok, no) => { const a = document.createElement('textarea'); a.value = text; a.setAttribute('readonly',''); a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); const d = document.execCommand('copy'); a.remove(); d ? ok() : no(); });
  }
  function selectEl(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  function enhance(root){
    $$('.kit .message', root).forEach(m => {
      const code = $('pre code', m), b = $('.copy-big', m); if (!code || !b) return;
      const name = m.getAttribute('data-label') || b.textContent, text = code.textContent.replace(/\n$/, '');
      b.addEventListener('click', () => copyText(text).then(() => { b.textContent = 'Copied'; b.setAttribute('data-done',''); setTimeout(() => { b.textContent = name; b.removeAttribute('data-done'); }, 2400); }, () => { b.textContent = 'Select the text below and copy it'; selectEl(code); }));
    });
    $$('.kit pre', root).forEach(pre => {
      if (pre.closest('.message') || pre.querySelector('code.language-output') || pre.querySelector('.copy')) return;
      const code = $('code', pre) || pre, text = code.textContent.replace(/\n$/, '');
      const b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';
      b.addEventListener('click', () => copyText(text).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1600); }, () => { b.textContent = 'Select and copy'; selectEl(code); }));
      pre.appendChild(b);
    });
  }

  // In-page links (#help-…, #update, #first-video) jump to whichever step holds them.
  const ID_STEP = {};
  STEPS.forEach((st, i) => { const t = document.getElementById('s-' + st.id); if (t) t.content.querySelectorAll('[id]').forEach(el => { if (!(el.id in ID_STEP)) ID_STEP[el.id] = i; }); });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const id = decodeURIComponent(a.getAttribute('href').slice(1)); if (!id) return;
    e.preventDefault();
    const reveal = () => { const el = document.getElementById(id); if (!el) return; for (let p = el; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); };
    if (!document.getElementById(id) && id in ID_STEP) { go(ID_STEP[id]); setTimeout(reveal, 60); } else reveal();
  });

  render();
})();
</script>

</body>
